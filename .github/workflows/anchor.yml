# Puts every release of this repository on the VesTally public record, using the action in this repo.
name: Anchor releases
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  anchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./anchor-action
        with:
          files: |
            verify-proof.mjs
            witness/witness.mjs
            contracts/RecordAnchor.sol
