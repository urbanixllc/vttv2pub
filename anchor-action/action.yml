name: VesTally Anchor my code
description: "Put each release (its commit and files) on the VesTally public record on BNB Chain. Free, no sign-up, no API key."
author: VesTally
branding:
  icon: anchor
  color: blue

inputs:
  files:
    description: "Files to seal, one glob per line (for example `dist/*.zip`). Their SHA-256 codes are sent; the files never are."
    required: false
    default: ""
  release-assets:
    description: "Also seal the assets attached to the release this workflow runs for (needs `contents: read`)."
    required: false
    default: "true"
  api-url:
    description: "VesTally API base URL."
    required: false
    default: https://vestallytoken.io/api
  site-url:
    description: "VesTally site, used for the check links in the job summary."
    required: false
    default: https://vestallytoken.io

outputs:
  commit-code:
    description: "The seal code for this commit."
    value: ${{ steps.anchor.outputs.commit-code }}
  check-url:
    description: "Link anyone can open to check this commit on the public record."
    value: ${{ steps.anchor.outputs.check-url }}

runs:
  using: composite
  steps:
    - id: anchor
      shell: bash
      env:
        INPUT_FILES: ${{ inputs.files }}
        INPUT_RELEASE_ASSETS: ${{ inputs.release-assets }}
        INPUT_API_URL: ${{ inputs.api-url }}
        INPUT_SITE_URL: ${{ inputs.site-url }}
        GH_TOKEN: ${{ github.token }}
      run: node "$GITHUB_ACTION_PATH/anchor.mjs"
